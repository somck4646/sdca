name: SDCA daily data

on:
  schedule:
    # checkonchain normally finalises each UTC day at about 23:13 UTC (10:13am Melbourne) but is sometimes hours late.
    # The job checks often through the day; a run that finds nothing new does nothing.
    - cron: '22 23 * * *'
    - cron: '47 23 * * *'
    - cron: '17 0 * * *'
    - cron: '47 0 * * *'
    - cron: '17 1 * * *'
    - cron: '47 1 * * *'
    - cron: '37 2 * * *'
    - cron: '37 3 * * *'
    - cron: '37 5 * * *'
    - cron: '37 8 * * *'
    - cron: '37 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-read even if today is already saved'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: sdca
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read checkonchain and build sdca_data
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: node scripts/update.mjs
      - name: Save if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "sdca-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sdca_data.json sdca_data.js history.jsonl
            git commit -m "SDCA data update"
            git pull --rebase
            git push
          else
            echo "nothing new"
          fi
